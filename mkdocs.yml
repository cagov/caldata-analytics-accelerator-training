site_name: CalData's Analytics Accelerator Training
theme:
  name: material
  logo: images/odi-square_logomark-blue.svg
  favicon: images/odi-circle_logomark-blue.png
  features:
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/quiz.js

repo_name: cagov/caldata-analytics-accelerator-training
repo_url: https://github.com/cagov/caldata-analytics-accelerator-training
edit_uri: ""

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      auto_title: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Welcome: index.md
  - Learning path: learning-path.md
  - Data sources: data-sources.md
  # - Data transformation:
  #     - dbt:
  #         - Part I - Foundations and staging models: data-transformation/dbt/pt-i-foundations-and-staging-models.md
